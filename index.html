<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/styles.css" />
    <script defer src="index.js"></script>
    <title>CV Yevhen Rudikov</title>
  </head>
  <body>
    <div class="main">
      <div class="container">
        <div class="language-switch">
          <button
            id="language-toggle"
            data-i18n="languageSwitch"
            style="display: none"
          ></button>
        </div>
      </div>

      <div class="content">
        <div class="about_wrapper">
          <div class="photo_wrapper">
            <img
              src="assets/img/image-photo2-1.png"
              alt="User photo "
              class="photo"
            />
          </div>
          <div class="about">
            <h1 class="aboutName" data-i18n="aboutName"></h1>
            <h2 class="aboutTitle">Software Engineer</h2>
            <div class="contacts mobile-contacts"></div>
          </div>
        </div>
        <p class="aboutDescription" data-i18n="aboutDescription"></p>

        <div class="skills-section">
          <div class="tSkills">
            <h3 class="sidebarTitle" data-i18n="techSkills"></h3>
            <ul class="skillsList" data-i18n="techSkillsList"></ul>
          </div>
          <div class="sSkills">
            <h3 class="sidebarTitle" data-i18n="languages"></h3>
            <ul
              class="skillsList language-skills"
              style="display: flex; gap: 60px"
              data-i18n="languagesList"
            ></ul>
          </div>
        </div>
        <div class="work"></div>
        <div class="education-wrapper">
          <div class="education education-university"></div>
          <div class="education education-courses"></div>
        </div>
      </div>
    </div>
  </body>
</html>
